[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "email-triage-env"
version = "1.0.0"
description = "A real-world OpenEnv environment where an AI agent learns to triage incoming emails."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "hackathon-submission"}
]
dependencies = [
    "openenv-core>=0.2.2",
    "fastapi",
    "uvicorn",
    "pydantic",
    "websockets",
    "openai",
    "requests"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["server*", "models*", "client*"]
