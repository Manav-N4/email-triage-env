spec_version: 1

name: email-triage-env
display_name: "Email Triage & Drafting Environment"
description: >
  Professional email triage environment for priority classification
  and high-quality drafting across three complexity levels.

runtime:
  image: Dockerfile
  port: 7860

app:
  entrypoint: server.app:app
  framework: fastapi

tasks:
  - id: email-001
    name: "Incident Classification (Easy)"
    difficulty: easy
    description: "Classify a high-priority server outage alert."
    reward_range: [0.01, 0.99]

  - id: email-002
    name: "Client Escalation (Medium)"
    difficulty: medium
    description: "Classify and draft an empathetic reply to a frustrated client."
    reward_range: [0.01, 0.99]

  - id: email-003
    name: "Strategic Board Mail (Hard)"
    difficulty: hard
    description: "Classify and draft a nuanced reply to a board member's strategic concerns."
    reward_range: [0.01, 0.99]

reward:
  range: [0.01, 0.99]
  components:
    - name: priority_score
      weight: 0.7
      range: [0.01, 0.99]
    - name: reply_score
      weight: 0.2
      range: [0.01, 0.99]
    - name: reasoning_score
      weight: 0.1
      range: [0.01, 0.99]